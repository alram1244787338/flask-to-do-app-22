{% extends "base.html" %}

{% block main %}
<div class="container-fluid">
  <div class="alert alert-danger" role="alert">
    <h4 class="alert-heading">Confirm Deletion</h4>
    <p class="mb-2">You are about to permanently delete the following task. This action cannot be undone.</p>
    <hr>
    <div class="row align-items-center">
      <div class="col">
        <h5 class="mb-0">{{ title }}</h5>
      </div>
      <div class="col-auto">
        <form action="{{ url_for('delete', task_id=task_id) }}" method="post" style="display:inline;">
          {{ form.csrf_token }}
          {{ form.submit(class="btn btn-danger") }}
        </form>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
