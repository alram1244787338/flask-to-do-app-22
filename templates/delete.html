{% extends "base.html" %}

{% block main %}
<div class="container-fluid">
  <div class="alert alert-danger">
    <strong>Warning:</strong> this will permanently delete the task and cannot be undone.
  </div>
  <p>Are you sure you want to delete the following task?</p>
  <h3>{{ title }}</h3>
  <form action="{{ url_for('delete', task_id=task_id) }}" method="post" class="mt-3">
    {{ form.csrf_token }}
    {{ form.submit(class="btn btn-danger", value="Yes, delete this task") }}
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
