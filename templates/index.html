{% extends "base.html" %}

{% block main %}
  {% for task in tasks %}
    <div class="card mb-2">
      <div class="card-body">
        <h3>{{ task.title }}</h3>
        <p class="text-muted mb-1">Created on {{ task.created_at.strftime('%Y-%m-%d %H:%M') }} UTC</p>
        <p class="text-muted">Last updated {{ task.updated_at.strftime('%Y-%m-%d %H:%M') }} UTC</p>
        <a href="{{ url_for('edit', task_id=task.id) }}" class="btn btn-primary">Edit</a>
        <form action="{{ url_for('delete', task_id=task.id) }}" method="get" class="d-inline">
          <button type="submit" class="btn btn-danger">Delete</button>
        </form>
      </div>
    </div>
  {% endfor %}
{% endblock %}
